name: Frontend CI

on:
  push:
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare CI release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/Frontend/.ci/homefix-ci-release.jks" \
            -storepass ci-store-password \
            -alias homefix-ci \
            -keypass ci-key-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=HomeFix CI,O=HomeFix,C=EG"
          echo "HOMEFIX_KEYSTORE_PATH=$GITHUB_WORKSPACE/Frontend/.ci/homefix-ci-release.jks" >> "$GITHUB_ENV"
          echo "HOMEFIX_KEYSTORE_PASSWORD=ci-store-password" >> "$GITHUB_ENV"
          echo "HOMEFIX_KEY_ALIAS=homefix-ci" >> "$GITHUB_ENV"
          echo "HOMEFIX_KEY_PASSWORD=ci-key-password" >> "$GITHUB_ENV"

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Release build
        run: flutter build apk --release --dart-define=HOMEFIX_API_URL=https://api.example.invalid
