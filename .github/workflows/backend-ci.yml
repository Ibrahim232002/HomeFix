name: Backend CI

on:
  push:
    branches:
      - phase-1.5-security-audit
      - backend-clean-architecture
      - backend-service-categories
      - feature/technician-services
  pull_request:
    branches:
      - phase-1.5-security-audit
      - backend-clean-architecture
      - backend-service-categories
      - feature/technician-services

env:
  DOTNET_VERSION: 8.0.x

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore API
        run: dotnet restore Backend/HomeFix.API/HomeFix.API.csproj

      - name: Restore tests
        run: dotnet restore Backend/HomeFix.Tests/HomeFix.Tests.csproj

      - name: Build API
        run: dotnet build Backend/HomeFix.API/HomeFix.API.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build Backend/HomeFix.Tests/HomeFix.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Backend/HomeFix.Tests/HomeFix.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Regenerate EF migration and snapshot
        if: github.ref == 'refs/heads/feature/technician-services'
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.28
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations remove --project Backend/HomeFix.DAL/HomeFix.DAL.csproj --startup-project Backend/HomeFix.API/HomeFix.API.csproj --force
          dotnet ef migrations add AddTechnicianProfileCategory --project Backend/HomeFix.DAL/HomeFix.DAL.csproj --startup-project Backend/HomeFix.API/HomeFix.API.csproj --output-dir Migrations
          dotnet ef migrations has-pending-model-changes --project Backend/HomeFix.DAL/HomeFix.DAL.csproj --startup-project Backend/HomeFix.API/HomeFix.API.csproj
          dotnet ef migrations list --project Backend/HomeFix.DAL/HomeFix.DAL.csproj --startup-project Backend/HomeFix.API/HomeFix.API.csproj

      - name: Upload regenerated EF artifacts
        if: github.ref == 'refs/heads/feature/technician-services'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-technician-category-ef
          path: |
            Backend/HomeFix.DAL/Migrations/*AddTechnicianProfileCategory*
            Backend/HomeFix.DAL/Migrations/HomeFixDbContextModelSnapshot.cs
