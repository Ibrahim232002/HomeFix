name: Backend CI

on:
  push:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  DOTNET_VERSION: 8.0.x

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Backend/HomeFix.slnx

      - name: Build
        run: dotnet build Backend/HomeFix.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Backend/HomeFix.slnx --configuration Release --no-build --verbosity normal
