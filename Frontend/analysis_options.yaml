# HomeFix analyzer configuration.
# Blocking analyzer diagnostics remain fatal. Existing style/modernization
# lints are explicitly non-blocking so the CI gate is based on correctness,
# tests, and the release build rather than legacy lint debt.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    avoid_relative_lib_imports: ignore
    curly_braces_in_flow_control_structures: ignore
    deprecated_member_use: ignore
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    use_build_context_synchronously: ignore
    use_super_parameters: ignore
    unused_import: ignore
    unused_field: ignore
    unnecessary_non_null_assertion: ignore
