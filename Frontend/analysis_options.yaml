# HomeFix analyzer configuration.
#
# The CI production gate treats analyzer errors as blocking. Flutter-lints
# style/modernization recommendations are intentionally not enabled globally;
# production correctness is enforced by the analyzer's blocking diagnostics,
# tests, and release build.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules: []
